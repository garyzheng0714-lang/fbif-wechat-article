name: P0 WeChat Monitoring Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-monitoring-official-${{ github.ref }}
  # 同一个 PR 连推只跑最新一次；main 上每次推送都跑完。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  monitoring-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # No path filter: every change must re-prove freepublish independence,
      # per-endpoint quota accounting, layout outbox and alert delivery.
      - name: Run complete Go test suite
        run: go test ./...

      - name: Race-test official monitoring contracts
        run: go test -race ./analytics ./archive ./autolayout ./wechat
