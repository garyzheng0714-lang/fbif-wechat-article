<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">fbif-wechat-article 公众号文章归档</title>
  <desc id="heroDesc">只使用微信公众号官方 API 的归档与数据采集服务：归档已发布文章、文章指标和粉丝指标，原始响应先按字节落 SQLite。图中是一篇已发布文章和它的六项指标。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#0B0F14"/>

  <!-- 左：标题区 -->
  <g id="title-block" class="sans">
    <rect x="64" y="76" width="6" height="22" rx="3" fill="#07C160"/>
    <text x="82" y="94" font-size="22" font-weight="600" fill="#3ED67F" letter-spacing="1">只走公众号官方 API · 归档与采集</text>

    <text x="64" y="166" font-size="50" font-weight="700" fill="#FFFFFF" letter-spacing="1">公众号文章归档</text>

    <text x="64" y="216" font-size="24" fill="#94A0AE">归档已发布文章、文章指标和粉丝指标，</text>
    <text x="64" y="252" font-size="24" fill="#94A0AE">原始响应先落库，再生成可查询的数据行。</text>

    <text x="64" y="316" font-size="18" class="mono" fill="#5A6572">Go 1.26 · SQLite 无 CGO · 15 个现役接口</text>
  </g>

  <!-- 右上：文章条目 -->
  <g id="article-row" class="sans">
    <rect x="600" y="52" width="536" height="66" rx="10" fill="#131A22"/>
    <rect x="600" y="52" width="4" height="66" fill="#07C160"/>
    <text x="622" y="82" font-size="19" font-weight="600" fill="#E6EBF0">2026 食品创新的三条真路径</text>
    <text x="622" y="104" font-size="16" fill="#7C8896">2026-05-30 · 头条 · 普通图文</text>
  </g>

  <!-- 右下：指标网格 -->
  <g id="metrics" class="sans">
    <rect x="600" y="132" width="170" height="70" rx="10" fill="#131A22"/>
    <text x="614" y="158" font-size="15" fill="#7C8896">阅读</text>
    <text x="614" y="188" font-size="24" font-weight="700" fill="#FFFFFF">12,480</text>

    <rect x="783" y="132" width="170" height="70" rx="10" fill="#131A22"/>
    <text x="797" y="158" font-size="15" fill="#7C8896">分享</text>
    <text x="797" y="188" font-size="24" font-weight="700" fill="#FFFFFF">826</text>

    <rect x="966" y="132" width="170" height="70" rx="10" fill="#131A22"/>
    <text x="980" y="158" font-size="15" fill="#7C8896">在看</text>
    <text x="980" y="188" font-size="24" font-weight="700" fill="#FFFFFF">341</text>

    <rect x="600" y="215" width="170" height="70" rx="10" fill="#131A22"/>
    <text x="614" y="241" font-size="15" fill="#7C8896">点赞</text>
    <text x="614" y="271" font-size="24" font-weight="700" fill="#FFFFFF">1,209</text>

    <rect x="783" y="215" width="170" height="70" rx="10" fill="#131A22"/>
    <text x="797" y="241" font-size="15" fill="#7C8896">收藏</text>
    <text x="797" y="271" font-size="24" font-weight="700" fill="#FFFFFF">452</text>

    <rect x="966" y="215" width="170" height="70" rx="10" fill="#131A22"/>
    <text x="980" y="241" font-size="15" fill="#7C8896">阅读完成率</text>
    <text x="980" y="271" font-size="24" font-weight="700" fill="#07C160">63%</text>
  </g>

  <!-- 底 -->
  <text x="600" y="326" font-size="16" class="mono" fill="#4B5563">原始响应按字节落 SQLite · 微信新增字段无需改结构</text>
</svg>
