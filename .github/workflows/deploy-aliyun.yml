name: Deploy To Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 go build -o wechat-sync .

      - name: Validate SSH Key
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-112.124.103.65}"
          USER="${ALIYUN_USER:-root}"

          mkdir -p ~/.ssh

          if [ -n "${ALIYUN_SSH_KEY:-}" ]; then
            KEY_HEAD="$(printf '%s' "${ALIYUN_SSH_KEY}" | head -n 1)"
            if printf '%s' "${KEY_HEAD}" | grep -qE '^ssh-(ed25519|rsa|dss) '; then
              echo "::error::ALIYUN_SSH_KEY looks like a public key. Please set private key content."
              exit 1
            fi

            RAW_KEY="$(printf '%b' "${ALIYUN_SSH_KEY}" | tr -d '\r')"
            if printf '%s' "${RAW_KEY}" | grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----'; then
              printf '%s\n' "${RAW_KEY}" | awk '
                /-----BEGIN OPENSSH PRIVATE KEY-----/ {in_key=1}
                in_key {print}
                /-----END OPENSSH PRIVATE KEY-----/ {if (in_key) {exit}}
              ' > ~/.ssh/id_aliyun
            else
              printf '%s' "${RAW_KEY}" > ~/.ssh/id_aliyun
            fi
          elif [ -n "${ALIYUN_SSH_KEY_B64:-}" ]; then
            printf '%s' "${ALIYUN_SSH_KEY_B64}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_aliyun
          else
            echo "::error::Missing Actions secret: ALIYUN_SSH_KEY or ALIYUN_SSH_KEY_B64"
            exit 1
          fi

          chmod 600 ~/.ssh/id_aliyun

          if ! ssh-keygen -y -f ~/.ssh/id_aliyun >/dev/null 2>/tmp/ssh_key_err.log; then
            echo "::error::Invalid private key content in Actions secret."
            cat /tmp/ssh_key_err.log || true
            exit 1
          fi

          if ! ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "echo SSH_OK" >/tmp/ssh_probe_out.log 2>/tmp/ssh_probe_err.log; then
            if grep -qi "Permission denied" /tmp/ssh_probe_err.log; then
              echo "::error::SSH authentication failed. Ensure public key is in ~/.ssh/authorized_keys."
            elif grep -Eqi "Connection timed out|No route to host|Connection refused" /tmp/ssh_probe_err.log; then
              echo "::error::Cannot reach server SSH/22 from GitHub Actions. Check Aliyun security group/firewall."
            else
              echo "::error::SSH probe failed."
            fi
            cat /tmp/ssh_probe_err.log || true
            exit 1
          fi

          grep -q "SSH_OK" /tmp/ssh_probe_out.log

      - name: Upload Binary To Server
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-112.124.103.65}"
          USER="${ALIYUN_USER:-root}"

          scp \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            wechat-sync \
            "${USER}@${HOST}:/tmp/wechat-sync"

      - name: Deploy On Server
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          APP_ENV_B64: ${{ secrets.APP_ENV_B64 }}
          REPORTER_WEBHOOK_URL: ${{ secrets.OFFICIAL_FEISHU_WEBHOOK_URL }}
          REPORTER_WEBHOOK_SECRET: ${{ secrets.OFFICIAL_FEISHU_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          HOST="${ALIYUN_HOST:-112.124.103.65}"
          USER="${ALIYUN_USER:-root}"

          cat > /tmp/remote_deploy.sh <<'REMOTE_SCRIPT'
            set -euo pipefail

            APP_ROOT="${APP_DIR:-/opt/fbif-wechat-article-dashboard}"
            BIN_DIR="${APP_ROOT}/bin"
            BINARY="${BIN_DIR}/wechat-sync"
            SERVICE_NAME="wechat-sync"
            UNIT_FILE="/etc/systemd/system/${SERVICE_NAME}.service"
            BACKUP_DIR="${APP_ROOT}/deploy-backups/$(date -u +%Y%m%dT%H%M%SZ)"
            NEW_ENV="/tmp/wechat-sync.env.$$"
            HAD_BINARY=0
            HAD_ROOT_ENV=0
            HAD_BIN_ENV=0
            HAD_UNIT=0

            mkdir -p "${BIN_DIR}" "${BACKUP_DIR}"
            trap 'rm -f "${NEW_ENV}"' EXIT

            if [ -f "${BINARY}" ]; then
              cp -p "${BINARY}" "${BACKUP_DIR}/wechat-sync"
              HAD_BINARY=1
            fi
            if [ -f "${APP_ROOT}/.env" ]; then
              cp -p "${APP_ROOT}/.env" "${BACKUP_DIR}/root.env"
              HAD_ROOT_ENV=1
            fi
            if [ -f "${BIN_DIR}/.env" ]; then
              cp -p "${BIN_DIR}/.env" "${BACKUP_DIR}/bin.env"
              HAD_BIN_ENV=1
            fi
            if [ -f "${UNIT_FILE}" ]; then
              cp -p "${UNIT_FILE}" "${BACKUP_DIR}/wechat-sync.service"
              HAD_UNIT=1
            fi

            # APP_ENV_B64 是部署环境的真值；只有 secret 未配置时才兼容服务器旧文件。
            SOURCE_ENV=""
            if [ -n "${APP_ENV_B64:-}" ]; then
              printf '%s' "${APP_ENV_B64}" | tr -d '\r\n ' | base64 -d > "${NEW_ENV}"
              SOURCE_ENV="${NEW_ENV}"
            elif [ -f "${APP_ROOT}/current/.env" ]; then
              SOURCE_ENV="${APP_ROOT}/current/.env"
            elif [ -f "${APP_ROOT}/.env" ]; then
              SOURCE_ENV="${APP_ROOT}/.env"
            elif [ -f "${BIN_DIR}/.env" ]; then
              SOURCE_ENV="${BIN_DIR}/.env"
            fi
            if [ -z "${SOURCE_ENV}" ] || [ ! -s "${SOURCE_ENV}" ]; then
              echo "No non-empty deployment environment is available"
              exit 1
            fi
            if [ "${SOURCE_ENV}" != "${NEW_ENV}" ]; then
              cp "${SOURCE_ENV}" "${NEW_ENV}"
              SOURCE_ENV="${NEW_ENV}"
            fi

            # 日报机器人凭证可用独立 GitHub Secret 覆盖，避免为了新增一个群机器人
            # 而搬运或重写整份 APP_ENV_B64。URL 一旦显式配置，SECRET 即使为空也
            # 必须同步清空，兼容未开启签名校验的自定义机器人。
            upsert_env_from_b64() {
              local key="$1"
              local encoded="$2"
              local value filtered
              value="$(printf '%s' "${encoded}" | tr -d '\r\n ' | base64 -d)"
              case "${value}" in
                *$'\n'*|*$'\r'*) echo "Reporter secret ${key} contains a newline"; exit 1 ;;
              esac
              filtered="${NEW_ENV}.filtered"
              grep -Ev "^[[:space:]]*(export[[:space:]]+)?${key}=" "${SOURCE_ENV}" > "${filtered}" || true
              printf '%s=%s\n' "${key}" "${value}" >> "${filtered}"
              chmod 0600 "${filtered}"
              mv "${filtered}" "${NEW_ENV}"
              SOURCE_ENV="${NEW_ENV}"
            }
            if [ "${OFFICIAL_FEISHU_OVERRIDE:-0}" = "1" ]; then
              upsert_env_from_b64 OFFICIAL_FEISHU_WEBHOOK_URL "${OFFICIAL_FEISHU_WEBHOOK_URL_B64:-}"
              upsert_env_from_b64 OFFICIAL_FEISHU_WEBHOOK_SECRET "${OFFICIAL_FEISHU_WEBHOOK_SECRET_B64:-}"
            fi

            require_key() {
              grep -Eq "^[[:space:]]*(export[[:space:]]+)?${1}=" "${SOURCE_ENV}"
            }
            require_key API_KEY || { echo "Deployment env missing API_KEY"; exit 1; }
            grep -Eq '^[[:space:]]*(export[[:space:]]+)?(WECHAT_APPID|WECHAT_MP_APPID)=' "${SOURCE_ENV}" || { echo "Deployment env missing WeChat app id"; exit 1; }
            grep -Eq '^[[:space:]]*(export[[:space:]]+)?(WECHAT_SECRET|WECHAT_APPSECRET|WECHAT_MP_SECRET)=' "${SOURCE_ENV}" || { echo "Deployment env missing WeChat secret"; exit 1; }
            if ! require_key OFFICIAL_FEISHU_WEBHOOK_URL; then
              require_key FEISHU_APP_ID || { echo "Deployment env missing FEISHU_APP_ID or OFFICIAL_FEISHU_WEBHOOK_URL"; exit 1; }
              require_key FEISHU_APP_SECRET || { echo "Deployment env missing FEISHU_APP_SECRET or OFFICIAL_FEISHU_WEBHOOK_URL"; exit 1; }
              require_key OFFICIAL_FEISHU_CHAT_ID || { echo "Deployment env missing OFFICIAL_FEISHU_CHAT_ID or OFFICIAL_FEISHU_WEBHOOK_URL"; exit 1; }
            fi
            if grep -Eq '^[[:space:]]*(export[[:space:]]+)?ENABLE_AUTO_LAYOUT=(1|true|TRUE)[[:space:]]*$' "${SOURCE_ENV}"; then
              require_key LAYOUT_OFFICIAL_SYNC_URL || { echo "Deployment env missing LAYOUT_OFFICIAL_SYNC_URL"; exit 1; }
              require_key PUBLISH_SYNC_SERVICE_TOKEN || { echo "Deployment env missing PUBLISH_SYNC_SERVICE_TOKEN"; exit 1; }
            fi

            rollback() {
              echo "Readiness failed; restoring previous official collector release"
              systemctl stop "${SERVICE_NAME}" 2>/dev/null || true
              if [ "${HAD_BINARY}" -eq 1 ]; then
                install -m 0755 "${BACKUP_DIR}/wechat-sync" "${BINARY}"
              else
                rm -f "${BINARY}"
              fi
              if [ "${HAD_ROOT_ENV}" -eq 1 ]; then
                install -m 0600 "${BACKUP_DIR}/root.env" "${APP_ROOT}/.env"
              else
                rm -f "${APP_ROOT}/.env"
              fi
              if [ "${HAD_BIN_ENV}" -eq 1 ]; then
                install -m 0600 "${BACKUP_DIR}/bin.env" "${BIN_DIR}/.env"
              else
                rm -f "${BIN_DIR}/.env"
              fi
              if [ "${HAD_UNIT}" -eq 1 ]; then
                install -m 0644 "${BACKUP_DIR}/wechat-sync.service" "${UNIT_FILE}"
              else
                rm -f "${UNIT_FILE}"
              fi
              systemctl daemon-reload
              if [ "${HAD_BINARY}" -eq 1 ] && [ "${HAD_UNIT}" -eq 1 ]; then
                systemctl start "${SERVICE_NAME}" || true
              fi
            }

            pm2 delete wechat-dashboard >/dev/null 2>&1 || true
            systemctl stop "${SERVICE_NAME}" 2>/dev/null || true
            install -m 0755 /tmp/wechat-sync "${BINARY}"
            install -m 0600 "${SOURCE_ENV}" "${APP_ROOT}/.env"
            install -m 0600 "${SOURCE_ENV}" "${BIN_DIR}/.env"

            # Create systemd service
            printf '%s\n' \
              '[Unit]' \
              'Description=WeChat Article Sync Service' \
              'After=network.target' \
              '' \
              '[Service]' \
              'Type=simple' \
              "ExecStart=${BINARY}" \
              "WorkingDirectory=${BIN_DIR}" \
              'Restart=on-failure' \
              'RestartSec=10' \
              'StandardOutput=journal' \
              'StandardError=journal' \
              "SyslogIdentifier=${SERVICE_NAME}" \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              > "${UNIT_FILE}"

            systemctl daemon-reload
            systemctl enable "${SERVICE_NAME}"
            systemctl start "${SERVICE_NAME}"

            # Health is operational readiness only. Historical coverage and
            # Base-write approval remain separately fail-closed in the API.
            READY=0
            for attempt in $(seq 1 60); do
              if curl -fsS --max-time 5 "http://127.0.0.1:3002/health" >/dev/null; then
                READY=1
                break
              fi
              sleep 3
            done
            if [ "${READY}" -ne 1 ]; then
              journalctl -u "${SERVICE_NAME}" -n 100 --no-pager || true
              rollback
              exit 1
            fi

            echo "Deploy complete: official collector is healthy"
          REMOTE_SCRIPT

          OFFICIAL_FEISHU_OVERRIDE=0
          OFFICIAL_FEISHU_WEBHOOK_URL_B64=""
          OFFICIAL_FEISHU_WEBHOOK_SECRET_B64=""
          if [ -n "${REPORTER_WEBHOOK_URL:-}" ]; then
            OFFICIAL_FEISHU_OVERRIDE=1
            OFFICIAL_FEISHU_WEBHOOK_URL_B64="$(printf '%s' "${REPORTER_WEBHOOK_URL}" | base64 -w 0)"
            OFFICIAL_FEISHU_WEBHOOK_SECRET_B64="$(printf '%s' "${REPORTER_WEBHOOK_SECRET:-}" | base64 -w 0)"
          fi

          REMOTE_ENV="$(printf \
            "APP_DIR=%q APP_ENV_B64=%q OFFICIAL_FEISHU_OVERRIDE=%q OFFICIAL_FEISHU_WEBHOOK_URL_B64=%q OFFICIAL_FEISHU_WEBHOOK_SECRET_B64=%q" \
            "${APP_DIR:-}" "${APP_ENV_B64:-}" "${OFFICIAL_FEISHU_OVERRIDE}" \
            "${OFFICIAL_FEISHU_WEBHOOK_URL_B64}" "${OFFICIAL_FEISHU_WEBHOOK_SECRET_B64}")"

          ssh \
            -i ~/.ssh/id_aliyun \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "${REMOTE_ENV} bash -s" < /tmp/remote_deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_aliyun /tmp/remote_deploy.sh wechat-sync
